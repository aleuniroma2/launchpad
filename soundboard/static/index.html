<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launchpad Soundboard</title>
<style>
:root {
  --bg: #f3f2ef; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #dcdad5;
  --device: #26262a; --device-edge: #18181b; --pad-off: #3a3a40; --pad-ink: #f1f1f1;
  --accent: #d98a00; --ok: #2f9e44; --bad: #c92a2a; --focus: #3b82f6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141416; --panel: #1e1e22; --ink: #ececf0; --muted: #9a9aa3; --line: #303036;
    --device: #0d0d0f; --device-edge: #000; --pad-off: #2c2c32;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, Ubuntu, Cantarell, "Noto Sans", "DejaVu Sans", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center;
  padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 16px; margin: 0 8px 0 0; letter-spacing: .2px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 10px;
  border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); display: block; }
.pill.on i { background: var(--ok); }
.ctl { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.spacer { flex: 1; }
button, select, input[type=text] { font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
button { cursor: pointer; }
button:hover { border-color: var(--muted); }
button.danger { color: #fff; background: var(--bad); border-color: var(--bad); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
.seg button.sel { background: var(--ink); color: var(--bg); }
main { display: grid; grid-template-columns: minmax(0, 600px) minmax(300px, 1fr); gap: 24px;
  padding: 24px 20px; max-width: 1200px; margin: 0 auto; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }

/* device replica */
.device { background: var(--device); border: 1px solid var(--device-edge); border-radius: 18px;
  padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 7px; }
.btn { position: relative; aspect-ratio: 1; background: var(--pad-off); border: 0; padding: 0;
  border-radius: 6px; color: var(--pad-ink); font-size: 9px; line-height: 1.1; overflow: hidden;
  display: flex; align-items: flex-end; justify-content: flex-start; text-align: left;
  transition: background-color .06s, box-shadow .06s; user-select: none; -webkit-user-select: none; }
.btn span { padding: 4px; text-shadow: 0 1px 2px rgba(0,0,0,.8); word-break: break-word;
  max-height: 100%; overflow: hidden; }
.btn.round { border-radius: 50%; width: 72%; height: 72%; margin: auto; align-items: center;
  justify-content: center; text-align: center; font-weight: 600; }
.btn.round span { padding: 0; }
.btn.lit { box-shadow: 0 0 12px var(--glow), inset 0 0 6px rgba(255,255,255,.25); }
.btn.flash { animation: flash .5s steps(1) infinite; }
@keyframes flash { 50% { background: var(--pad-off); box-shadow: none; } }
.btn.selected { outline: 2px solid var(--focus); outline-offset: 2px; }
.btn.held { transform: scale(.94); }
.btn.drop { outline: 2px dashed #fff; }
.logo { display: flex; align-items: center; justify-content: center; color: #777; font-size: 9px;
  letter-spacing: 1px; }
.pagebar { display: flex; justify-content: space-between; align-items: center; margin-top: 14px;
  color: #aaa; font-size: 12px; gap: 8px; }
.pagebar input, .pagebar select.dark { background: transparent; color: #eee; border-color: #444; }
.pagebar input { width: 150px; }
.pagebar select.dark option { color: #111; }
.seg.wrap { flex-wrap: wrap; }
.octave { display: inline-flex; align-items: center; gap: 10px; }
.octave b { min-width: 70px; text-align: center; }
.colors.four { grid-template-columns: repeat(4, 1fr); }
.legend { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; }
.hint { color: var(--muted); font-size: 12px; margin-top: 10px; }

/* editor */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.panel h2 { margin: 0 0 4px; font-size: 15px; }
.panel .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
.field { margin-bottom: 14px; }
.field > label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row select, .row input[type=text] { flex: 1; min-width: 0; }
.colors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.swatches { display: grid; grid-template-columns: repeat(4, 22px); gap: 4px; }
.sw { width: 22px; height: 22px; border-radius: 4px; border: 1px solid rgba(0,0,0,.25); cursor: pointer;
  padding: 0; }
.sw.sel { outline: 2px solid var(--focus); outline-offset: 1px; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
input[type=range] { accent-color: var(--accent); }
.check { display: flex; align-items: center; gap: 6px; font-size: 13px; }

/* transport */
.transport { display: flex; align-items: center; gap: 8px; padding: 8px 20px; border-bottom: 1px solid var(--line);
  background: var(--panel); flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.transport input[type=number] { width: 64px; font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 5px 6px; }
.transport button.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.beats { display: inline-flex; gap: 4px; margin-left: 4px; }
.beats i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: block; }
.beats i.on { background: var(--accent); }
.beats i.on.first { background: var(--bad); }

#aBtn.on { background: var(--ok); border-color: var(--ok); color: #fff; }
#aBtn.wait { border-color: var(--accent); color: var(--accent); }

/* effects */
details.fx { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 14px; }
details.fx summary { cursor: pointer; font-size: 12px; color: var(--muted); }
details.fx summary b { color: var(--ink); font-weight: 600; }
.fxgrid { display: grid; grid-template-columns: 90px 1fr 54px; gap: 6px 10px; align-items: center; margin-top: 10px; font-size: 12px; }
.fxgrid input[type=range] { width: 100%; }
.fxgrid output { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }

/* looper + sequencer editors */
.tracks { display: grid; gap: 6px; margin-bottom: 14px; }
.track { display: grid; grid-template-columns: 64px 1fr auto; gap: 8px; align-items: center;
  border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; }
.track b { font-size: 12px; }
.track .st { font-size: 11px; color: var(--muted); }
.track .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.track .bar i { display: block; height: 100%; width: 0; background: var(--ok); }
.track.recording .bar i, .track.armed .bar i { background: var(--bad); }
.track.muted { opacity: .6; }
.track .btns { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.track .btns button { padding: 4px 8px; font-size: 12px; }
.track .btns button.rec { color: var(--bad); }
.rowmap { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
.rowmap label { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.rowmap select { flex: 1; min-width: 0; }
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.slots label { font-size: 11px; color: var(--muted); display: grid; gap: 2px; }
</style>
</head>
<body>
<header>
  <h1>Launchpad Soundboard</h1>
  <span id="conn" class="pill"><i></i><b>Not connected</b></span>
  <div class="seg" role="group" aria-label="Click mode">
    <button id="mEdit" class="sel" title="Clicking a pad selects it for editing">Edit</button>
    <button id="mPlay" title="Clicking a pad plays it like the hardware">Play</button>
  </div>
  <label class="check"><input type="checkbox" id="follow" checked> Select pad on hardware press</label>
  <span class="spacer"></span>
  <div class="ctl">Volume <input type="range" id="vol" min="0" max="1" step="0.01"></div>
  <div class="ctl">LED brightness <input type="range" id="bright" min="0" max="12" step="1"><span id="brightTxt"></span></div>
  <div class="ctl">
    <select id="testLvl" aria-label="LED test level"><option value="1">Test low</option><option value="2">Test medium</option><option value="3" selected>Test full</option></select>
    <button id="test">LED test</button>
    <button id="anim">Animation</button>
  </div>
  <button id="stopAll" class="danger">Stop all</button>
</header>
<div class="transport" role="group" aria-label="Transport">
  <button id="tPlay" title="Start / stop the clock (sequencer, looper, metronome)">▶ Play</button>
  <label class="ctl">BPM <input type="number" id="tBpm" min="40" max="300" step="1"></label>
  <button id="tTap" title="Tap a few times in rhythm to set the tempo">Tap</button>
  <label class="check"><input type="checkbox" id="tMetro"> Metronome</label>
  <span class="beats" id="tBeats" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  <span class="spacer"></span>
  <span id="tLoops"></span>
  <label class="ctl">Sound plays on
    <select id="aOut" aria-label="Audio output">
      <option value="host">Host machine</option><option value="browser">This browser</option><option value="both">Both</option>
    </select></label>
  <button id="aBtn" title="Browsers only allow sound after a click">🔇 Browser sound off</button>
</div>

<main>
  <section>
    <div class="device">
      <div class="grid" id="grid"></div>
      <div class="pagebar">
        <span>Top row = pages</span>
        <span class="row" style="flex:0 1 auto">
          <select id="pageType" aria-label="Page type" class="dark">
            <option value="soundboard">Soundboard</option><option value="piano">Piano / synth</option><option value="drums">Drum kit</option><option value="sequencer">Step sequencer</option><option value="looper">Looper</option>
          </select>
          <input type="text" id="pageName" aria-label="Page name">
        </span>
      </div>
    </div>
    <p class="hint">Drop audio files onto a pad to assign them. Sounds keep playing when you switch pages; the page buttons flash green while they have sounds playing.</p>
  </section>
  <section class="panel" id="editor"><div class="empty">Select a pad (click it, or press it on the Launchpad)</div></section>
</main>

<script>
const $ = s => document.querySelector(s);
let S = null;           // full state from /api/state
let snap = null;        // live snapshot from SSE
let selected = null;
let clickMode = "edit";
let lastPressSeen = null;

const R = [0, 140, 205, 255], G = [0, 130, 195, 235];
function rgb(c) {
  const [r, g] = c;
  if (!r && !g) return null;
  return `rgb(${R[r]}, ${G[g]}, ${r && g ? 20 : 30})`;
}
const NAMES = {"0,0":"off","1,0":"red low","2,0":"red mid","3,0":"red","0,1":"green low","0,2":"green mid",
  "0,3":"green","1,1":"amber low","2,2":"amber mid","3,3":"amber","3,2":"orange","2,3":"yellow","1,3":"lime"};

function api(path, body) {
  return fetch(path, {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body || {})}).then(r => r.json());
}

function ids() {
  const out = [];
  for (let x = 0; x < 8; x++) out.push(`top${x}`);
  out.push("logo");
  for (let y = 0; y < 8; y++) { for (let x = 0; x < 8; x++) out.push(`pad${x}${y}`); out.push(`side${y}`); }
  return out;
}

function buildGrid() {
  const grid = $("#grid");
  for (const id of ids()) {
    if (id === "logo") { const d = document.createElement("div"); d.className = "logo"; d.textContent = "LP"; grid.append(d); continue; }
    const b = document.createElement("button");
    b.className = "btn" + (id.startsWith("pad") ? "" : " round");
    b.id = "b-" + id;
    b.innerHTML = "<span></span>";
    b.setAttribute("aria-label", id);
    const down = e => {
      e.preventDefault();
      const inst = snap && snap.page_type !== "soundboard";  // instrument pages always play
      if (inst || clickMode === "play" || id.startsWith("top")) { b._down = true; api("/api/press", {id, down: true}); }
      if (clickMode === "edit" && !inst) select(id);
    };
    const up = () => { if (b._down) { b._down = false; api("/api/press", {id, down: false}); } };
    b.addEventListener("pointerdown", down);
    b.addEventListener("pointerup", up);
    b.addEventListener("pointerleave", up);
    if (!id.startsWith("top")) {
      b.addEventListener("dragover", e => { e.preventDefault(); b.classList.add("drop"); });
      b.addEventListener("dragleave", () => b.classList.remove("drop"));
      b.addEventListener("drop", async e => {
        e.preventDefault(); b.classList.remove("drop");
        const f = e.dataTransfer.files[0]; if (!f) return;
        const res = await upload(f); if (!res) return;
        const cur = btnCfg(id) || {...S.defaults, idle: [0, 1]};
        await saveBtn(id, {...cur, action: "sound", sound: res.name, label: cur.label || res.name.replace(/\.[^.]+$/, "")});
        select(id);
      });
    }
    grid.append(b);
  }
}

const page = () => (snap ? snap.page : S.config.page);
const btnCfg = id => { const b = S.config.pages[page()].buttons[id]; return b ? {...S.defaults, ...b} : null; };

function render() {
  if (!S || !snap) return;
  const conn = $("#conn");
  conn.classList.toggle("on", snap.connected);
  conn.querySelector("b").textContent = snap.connected ? "Launchpad connected" : "Launchpad not connected";
  for (const id of ids()) {
    if (id === "logo") continue;
    const el = $("#b-" + id);
    const [r, g, fl] = snap.leds[id] || [0, 0, false];
    const c = rgb([r, g]);
    el.style.background = c || "";
    el.style.setProperty("--glow", c || "transparent");
    el.classList.toggle("lit", !!c);
    el.classList.toggle("flash", !!(c && fl));
    el.classList.toggle("selected", id === selected);
    el.classList.toggle("held", snap.held.includes(id));
    let label = "", title = "";
    if (id.startsWith("top")) {
      const p = +id.slice(3);
      label = String(p + 1);
      title = `${S.config.pages[p].name} (${snap.page_types[p]})`;
    } else if (snap.labels) label = snap.labels[id] || "";
    else { const b = btnCfg(id); if (b) label = b.action === "stop_all" ? "STOP" : b.action === "stop_page" ? "STOP PG" : (b.label || b.sound); }
    el.querySelector("span").textContent = label;
    el.title = title || label;
  }
  const pn = $("#pageName");
  if (document.activeElement !== pn) pn.value = S.config.pages[page()].name;
  $("#pageType").value = snap.page_type;
}

function select(id) {
  selected = id; render(); renderEditor();
}

function swatches(key, cur) {
  let h = `<div class="swatches" role="radiogroup" aria-label="${key} colour">`;
  for (let g = 3; g >= 0; g--) for (let r = 0; r < 4; r++) {
    const c = rgb([r, g]) || "var(--pad-off)";
    const sel = cur[0] === r && cur[1] === g ? " sel" : "";
    h += `<button class="sw${sel}" style="background:${c}" data-key="${key}" data-c="${r},${g}" title="${NAMES[r+","+g] || `red ${r} / green ${g}`}"></button>`;
  }
  return h + "</div>";
}

const FX_UI = [
  ["pitch", "Pitch", 1, v => (v > 0 ? "+" : "") + v + " st"],
  ["fine", "Fine tune", 1, v => (v > 0 ? "+" : "") + v + " ct"],
  ["drive", "Distortion", 0.01, v => Math.round(v * 100) + "%"],
  ["crush", "Bit-crush", 0.01, v => Math.round(v * 100) + "%"],
  ["tone", "Tone (low-pass)", 0.01, v => v >= 0.999 ? "open" : Math.round(150 * Math.pow(20000 / 150, v)) + " Hz"],
  ["echo", "Echo", 0.01, v => Math.round(v * 100) + "%"],
  ["echo_time", "Echo time", 0.01, v => Math.round(v * 1000) + " ms"],
  ["reverb", "Reverb", 0.01, v => Math.round(v * 100) + "%"],
];
// Collapsible effects panel. onChange(patch) receives only the changed key(s).
function fxPanel(cur, onChange, note) {
  cur = {...S.fx_defaults, ...(cur || {})};
  const active = FX_UI.filter(([k]) => k !== "echo_time" && cur[k] !== S.fx_defaults[k]).map(f => f[1]);
  if (cur.reverse) active.push("Reverse");
  const id = "fx" + Math.random().toString(36).slice(2, 7);
  let h = `<details class="fx" id="${id}" ${fxOpen ? "open" : ""}><summary><b>Effects</b> · ${active.length ? esc(active.join(", ")) : "none"}</summary>
    ${note ? `<div class="hint" style="margin-top:6px">${note}</div>` : ""}<div class="fxgrid">`;
  for (const [k, label, step, fmt] of FX_UI) {
    const [lo, hi] = S.fx_limits[k];
    h += `<label for="${id}-${k}">${label}</label><input type="range" id="${id}-${k}" data-k="${k}" min="${lo}" max="${hi}" step="${step}" value="${cur[k]}">
      <output id="${id}-${k}-o">${fmt(cur[k])}</output>`;
  }
  h += `</div><div class="row" style="margin-top:10px"><label class="check"><input type="checkbox" data-k="reverse" ${cur.reverse ? "checked" : ""}> Reverse</label>
    <span class="spacer"></span><button type="button" data-reset>Reset effects</button></div></details>`;
  setTimeout(() => {
    const root = document.getElementById(id); if (!root) return;
    root.addEventListener("toggle", () => fxOpen = root.open);
    root.querySelectorAll("input[type=range]").forEach(r => {
      const f = FX_UI.find(x => x[0] === r.dataset.k);
      r.oninput = () => document.getElementById(`${id}-${r.dataset.k}-o`).textContent = f[3](+r.value);
      r.onchange = () => onChange({[r.dataset.k]: +r.value});
      r.ondblclick = () => { r.value = S.fx_defaults[r.dataset.k]; r.oninput(); r.onchange(); };
    });
    root.querySelector("input[type=checkbox]").onchange = e => onChange({reverse: e.target.checked});
    root.querySelector("[data-reset]").onclick = () => onChange({...S.fx_defaults});
  });
  return h;
}
let fxOpen = false;

function renderInstrumentEditor() {
  const ed = $("#editor"), p = page(), sy = S.synth, type = snap.page_type;
  if (type === "looper") return renderLooper();
  const inst = snap.inst;
  const send = patch => api("/api/instrument", {page: p, inst: patch});
  const sendSeq = patch => api("/api/instrument", {page: p, seq: patch});
  const seg = (key, items, cur) => `<div class="seg wrap" id="seg-${key}">` + Object.entries(items).map(([v, n]) =>
    `<button data-v="${v}" class="${v === cur ? "sel" : ""}">${esc(n)}</button>`).join("") + "</div>";
  const vol = `<div class="field"><label for="iVol">Volume <span id="iVolTxt">${Math.round(inst.volume * 100)}%</span></label>
        <input type="range" id="iVol" min="0" max="1.5" step="0.01" value="${inst.volume}" style="width:100%"></div>`;
  const col = inst.colors;
  if (type === "piano") {
    const lo = inst.octave + 1, hi = inst.octave + (inst.layout === "piano" ? 5 : 4);
    const slotSel = i => `<label>Side ${i + 3}<select data-slot="${i}">` + Object.entries(sy.patches).map(([v, n]) =>
      `<option value="${v}" ${inst.slots[i] === v ? "selected" : ""}>${esc(n)}</option>`).join("") + "</select></label>";
    ed.innerHTML = `
      <h2>Piano / synth</h2><div class="sub">${esc(S.config.pages[p].name)} · play on the grid · side buttons: 1–2 octave up/down, 3–8 sound slots</div>
      <div class="field"><label>Sound (${Object.keys(sy.patches).length} instruments)</label>${seg("patch", sy.patches, inst.patch)}</div>
      <div class="field"><label>Sounds on side buttons 3–8</label><div class="slots">${[0,1,2,3,4,5].map(slotSel).join("")}</div></div>
      <div class="field"><label for="iLayout">Grid layout</label>
        <select id="iLayout" style="width:100%">
          <option value="piano">Piano keys: rows of white keys with black keys above, 4 octaves</option>
          <option value="scale">Scale grid: only notes in key, each row a 4th higher</option></select></div>
      <div class="field"><label>Key</label><div class="row">
        <select id="iRoot" aria-label="Root note">${sy.notes.map((n, i) => `<option value="${i}">${n}</option>`).join("")}</select>
        <select id="iScale" aria-label="Scale" ${inst.layout === "piano" ? "disabled title='Used by the scale grid layout'" : ""}>${sy.scales.map(s => `<option>${s}</option>`).join("")}</select></div></div>
      <div class="field"><label>Octave</label><div class="octave">
        <button id="oDown" ${inst.octave <= 0 ? "disabled" : ""}>−</button><b>C${lo} – C${hi}</b><button id="oUp" ${inst.octave >= 5 ? "disabled" : ""}>+</button></div></div>
      ${vol}
      ${fxPanel(inst.fx, patch => send({fx: patch}), "Pitch transposes the synth (and fine-tunes it in cents).")}
      <div class="field"><label>LED colours</label><div class="colors four">
        <div><label>${inst.layout === "piano" ? "White keys" : "Notes"}</label>${swatches("key", col.key)}</div>
        <div><label>Black keys</label>${swatches("black", col.black)}</div>
        <div><label>Root note</label>${swatches("root", col.root)}</div>
        <div><label>Pressed</label>${swatches("pressed", col.pressed)}</div></div></div>`;
    $("#iLayout").value = inst.layout; $("#iRoot").value = inst.root; $("#iScale").value = inst.scale;
    $("#iLayout").onchange = e => send({layout: e.target.value});
    $("#iRoot").onchange = e => send({root: +e.target.value});
    $("#iScale").onchange = e => send({scale: e.target.value});
    $("#oDown").onclick = () => send({octave: inst.octave - 1});
    $("#oUp").onclick = () => send({octave: inst.octave + 1});
    ed.querySelectorAll("[data-slot]").forEach(sel => sel.onchange = () => {

// ------------------------------------------------------------------ browser audio
// The server mixes everything and streams 16-bit stereo PCM from /api/audio; we buffer a few
// tens of ms and play it with an AudioWorklet (secure contexts) or a ScriptProcessor (plain http).
const RING_SRC = `
class Ring {
  constructor(sr) { this.n = sr * 2; this.L = new Float32Array(this.n); this.R = new Float32Array(this.n);
    this.w = 0; this.r = 0; this.count = 0; this.target = Math.round(sr * 0.06); this.max = Math.round(sr * 0.25);
    this.priming = true; }
  push(l, r) { for (let i = 0; i < l.length; i++) { this.L[this.w] = l[i]; this.R[this.w] = r[i]; this.w = (this.w + 1) % this.n; }
    this.count = Math.min(this.n, this.count + l.length);
    if (this.count > this.max) { const drop = this.count - this.target; this.r = (this.r + drop) % this.n; this.count -= drop; } }
  pull(outL, outR) {
    if (this.priming && this.count < this.target) { outL.fill(0); outR.fill(0); return; }
    this.priming = false;
    for (let i = 0; i < outL.length; i++) {
      if (this.count > 0) { outL[i] = this.L[this.r]; outR[i] = this.R[this.r]; this.r = (this.r + 1) % this.n; this.count--; }
      else { outL[i] = 0; outR[i] = 0; this.priming = true; }
    } }
}`;
const WORKLET_SRC = RING_SRC + `
registerProcessor("lp-stream", class extends AudioWorkletProcessor {
  constructor() { super(); this.ring = new Ring(sampleRate); this.port.onmessage = e => this.ring.push(e.data[0], e.data[1]); }
  process(_in, outs) { const o = outs[0]; this.ring.pull(o[0], o[1] || new Float32Array(o[0].length)); return true; }
});`;
const BA = {on: false, ctx: null, node: null, ring: null, ctrl: null, worklet: false, rs: {pos: 0, l: 0, r: 0}};
const browserWanted = () => snap && snap.audio.output !== "host";

async function startBrowserAudio() {
  if (BA.on) return;
  BA.on = true; updateAudioUi();
  const sr = S.samplerate;
  try { BA.ctx = new AudioContext({sampleRate: sr, latencyHint: "interactive"}); }
  catch (e) { BA.ctx = new AudioContext({latencyHint: "interactive"}); }  // resampled below
  await BA.ctx.resume();
  BA.worklet = false;
  if (window.isSecureContext && BA.ctx.audioWorklet) {
    try {
      const url = URL.createObjectURL(new Blob([WORKLET_SRC], {type: "application/javascript"}));
      await BA.ctx.audioWorklet.addModule(url);
      BA.node = new AudioWorkletNode(BA.ctx, "lp-stream", {numberOfInputs: 0, outputChannelCount: [2]});
      BA.worklet = true;
    } catch (e) { console.warn("AudioWorklet unavailable, falling back", e); }
  }
  if (!BA.worklet) {
    BA.ring = new (new Function(RING_SRC + "; return Ring;")())(BA.ctx.sampleRate);
    BA.node = BA.ctx.createScriptProcessor(1024, 1, 2);
    BA.node.onaudioprocess = e => BA.ring.pull(e.outputBuffer.getChannelData(0), e.outputBuffer.getChannelData(1));
  }
  BA.node.connect(BA.ctx.destination);
  streamLoop();
  updateAudioUi();
}

function stopBrowserAudio() {
  BA.on = false;
  if (BA.ctrl) BA.ctrl.abort();
  if (BA.ctx) BA.ctx.close();
  BA.ctx = BA.node = BA.ring = BA.ctrl = null;
  updateAudioUi();
}

function pushPcm(bytes) {
  const n = bytes.length >> 2, v = new DataView(bytes.buffer, bytes.byteOffset, n * 4);
  let l = new Float32Array(n), r = new Float32Array(n);
  for (let i = 0; i < n; i++) { l[i] = v.getInt16(4 * i, true) / 32768; r[i] = v.getInt16(4 * i + 2, true) / 32768; }
  const ratio = S.samplerate / BA.ctx.sampleRate;
  if (Math.abs(ratio - 1) > 1e-6) {          // linear resampling, continuous across chunks
    const st = BA.rs, out = Math.floor((n - st.pos) / ratio), L2 = new Float32Array(out), R2 = new Float32Array(out);
    for (let i = 0; i < out; i++) {
      const p = st.pos + i * ratio, k = Math.floor(p), f = p - k;
      const l0 = k < 0 ? st.l : l[k], r0 = k < 0 ? st.r : r[k], l1 = l[Math.min(n - 1, k + 1)], r1 = r[Math.min(n - 1, k + 1)];
      L2[i] = l0 + (l1 - l0) * f; R2[i] = r0 + (r1 - r0) * f;
    }
    st.pos = st.pos + out * ratio - n; st.l = l[n - 1]; st.r = r[n - 1];
    l = L2; r = R2;
  }
  if (BA.worklet) BA.node.port.postMessage([l, r], [l.buffer, r.buffer]);
  else BA.ring.push(l, r);
}

async function streamLoop() {
  while (BA.on) {
    BA.ctrl = new AbortController();
    try {
      const res = await fetch("/api/audio", {signal: BA.ctrl.signal, cache: "no-store"});
      const reader = res.body.getReader();
      let rest = new Uint8Array(0);
      for (;;) {
        const {value, done} = await reader.read();
        if (done || !BA.on) break;
        let buf = value;
        if (rest.length) { buf = new Uint8Array(rest.length + value.length); buf.set(rest); buf.set(value, rest.length); }
        const usable = buf.length - (buf.length % 4);
        if (usable) pushPcm(buf.subarray(0, usable));
        rest = buf.slice(usable);
      }
    } catch (e) { if (!BA.on) break; }
    if (BA.on) await new Promise(r => setTimeout(r, 1000));  // server restarted? reconnect
  }
}

function updateAudioUi() {
  if (!snap) return;
  const sel = $("#aOut"), btn = $("#aBtn");
  if (document.activeElement !== sel) sel.value = snap.audio.output;

function initAudioUi() {
  const sel = $("#aOut");
  if (!S.host_audio) for (const o of sel.options) if (o.value !== "browser") o.textContent += " (no sound card)";
  sel.onchange = async e => {

    if (out === "host") stopBrowserAudio(); else startBrowserAudio();   // the change is a user gesture
  };
  $("#aBtn").onclick = () => {
    if (BA.on) { stopBrowserAudio(); try { localStorage.setItem("lpBrowserAudio", "off"); } catch (e) {} }
    else { startBrowserAudio(); try { localStorage.removeItem("lpBrowserAudio"); } catch (e) {} }
  };
  // Browsers need a click before playing sound: start on the first interaction if wanted.
  const firstGesture = () => {
    let off = false; try { off = localStorage.getItem("lpBrowserAudio") === "off"; } catch (e) {}
    if (browserWanted() && !BA.on && !off) startBrowserAudio();
  };
  document.addEventListener("pointerdown", firstGesture, {once: true, capture: true});
  document.addEventListener("keydown", firstGesture, {once: true, capture: true});
  updateAudioUi();
}

const seqShape = s => s.seq ? JSON.stringify([s.seq.rows, s.seq.length]) : "";
const loopShape = s => JSON.stringify([s.transport.bars, s.transport.quantize]);
init();
</script>
</body>
